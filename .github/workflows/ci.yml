name: RTL verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: udp-filter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      # Pinned so CI uses the same Yosys, Icarus, Verilator, nextpnr, and
      # SymbiYosys as the checked-in results in results/tool_versions.txt.
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: "2026-10-01"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all checks
        run: python scripts/run_all.py
      - name: Publish summary
        if: always()
        run: |
          for report in regression_summary fpga_summary formal_summary lint_summary synthesis_summary; do
            if [ -f "results/$report.md" ]; then
              cat "results/$report.md" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: udp-filter-results-${{ github.sha }}
          path: results/
          if-no-files-found: error
