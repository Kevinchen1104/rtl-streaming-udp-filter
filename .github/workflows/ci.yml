name: RTL verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: udp-filter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run canonical checks
        run: python scripts/run_all.py
      - name: Upload evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: udp-filter-evidence-${{ github.sha }}
          path: results/
          if-no-files-found: error
